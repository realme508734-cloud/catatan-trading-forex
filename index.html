<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Catatan Trading Forex</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',sans-serif;background:#0f172a;color:#e2e8f0;padding:20px}
.container{max-width:900px;margin:0 auto}
h1{text-align:center;color:#38bdf8;margin:20px 0;font-size:28px}
.card{background:#1e293b;border-radius:16px;padding:20px;margin-bottom:20px;border:1px solid #334155}
.card h2{color:#38bdf8;margin-bottom:15px;font-size:18px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:600px){.grid{grid-template-columns:1fr}}
input,select,textarea{width:100%;padding:12px;border-radius:8px;border:1px solid #334155;background:#0f172a;color:white;font-size:14px}
label{font-size:12px;color:#94a3b8;margin-bottom:6px;display:block;margin-top:8px}
button{width:100%;padding:14px;background:#0ea5e9;color:white;border:none;border-radius:10px;font-weight:bold;font-size:16px;cursor:pointer;margin-top:10px}
button:hover{background:#0284c7}
table{width:100%;border-collapse:collapse;margin-top:10px}
th,td{padding:10px;text-align:left;border-bottom:1px solid #334155;font-size:13px}
th{color:#94a3b8;font-size:11px;text-transform:uppercase}
.badge{padding:4px 8px;border-radius:20px;font-size:11px;font-weight:bold}
.profit{background:#14532d;color:#4ade80}
.loss{background:#7f1d1d;color:#f87171}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:20px}
.stat{background:#1e293b;padding:15px;border-radius:12px;text-align:center;border:1px solid #334155}
.stat b{display:block;font-size:20px;margin-top:5px}
.stat.profit b{color:#4ade80}
.stat.loss b{color:#f87171}
</style>
</head>
<body>
<div class="container">
<h1>📈 Catatan Trading Forex</h1>
<div class="stats">
<div class="stat">Total Trade<b id="totalTrade">0</b></div>
<div class="stat profit">Profit<b id="totalProfit">0</b></div>
<div class="stat loss">Win Rate<b id="winRate">0%</b></div>
</div>
<div class="card">
<h2>➕ Tambah Trade Baru</h2>
<div class="grid">
<div><label>Tanggal</label><input type="date" id="tanggal"></div>
<div><label>Pair</label><select id="pair"><option>EURUSD</option><option>GBPUSD</option><option>XAUUSD</option><option>USDJPY</option><option>GBPJPY</option><option>EURJPY</option><option>AUDUSD</option><option>USDCAD</option></select></div>
<div><label>Posisi</label><select id="posisi"><option>BUY</option><option>SELL</option></select></div>
<div><label>Lot</label><input type="number" id="lot" step="0.01" value="0.01"></div>
<div><label>Entry</label><input type="number" id="entry" step="0.00001" placeholder="1.08500"></div>
<div><label>Exit</label><input type="number" id="exitPrice" step="0.00001" placeholder="1.08700"></div>
<div><label>Profit $</label><input type="number" id="profit" step="0.01" placeholder="15.5 / -10"></div>
<div><label>Strategi</label><select id="strategi"><option>Breakout</option><option>Supply Demand</option><option>SMC</option><option>Support Resistance</option><option>Scalping</option></select></div>
</div>
<label>Catatan</label><textarea id="catatan" rows="2" placeholder="Alasan entry, emosi, kesalahan..."></textarea>
<button onclick="tambahTrade()">Simpan Trade</button>
</div>
<div class="card">
<h2>📊 Riwayat Trade</h2>
<div style="overflow-x:auto">
<table>
<thead><tr><th>Tanggal</th><th>Pair</th><th>Posisi</th><th>Profit</th><th>Catatan</th><th></th></tr></thead>
<tbody id="tbody"></tbody>
</table>
</div>
<button onclick="hapusSemua()" style="background:#334155;margin-top:15px">Hapus Semua Data</button>
</div>
</div>
<script>
let trades=JSON.parse(localStorage.getItem('forex_trades')||'[]');
function render(){
const tbody=document.getElementById('tbody');tbody.innerHTML='';let profitTotal=0,win=0;
trades.forEach((t,i)=>{profitTotal+=parseFloat(t.profit);if(t.profit>0)win++;tbody.innerHTML+=`<tr><td>${t.tanggal}</td><td><b>${t.pair}</b></td><td>${t.posisi}</td><td><span class="badge ${t.profit>=0?'profit':'loss'}">${t.profit}$</span></td><td style="max-width:150px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${t.catatan}</td><td><button onclick="hapus(${i})" style="padding:4px 8px;width:auto;background:#7f1d1d;font-size:11px">X</button></td></tr>`;});
document.getElementById('totalTrade').innerText=trades.length;document.getElementById('totalProfit').innerText='$'+profitTotal.toFixed(2);document.getElementById('winRate').innerText=trades.length?Math.round(win/trades.length*100)+'%':'0%';localStorage.setItem('forex_trades',JSON.stringify(trades));}
function tambahTrade(){const t={tanggal:document.getElementById('tanggal').value||new Date().toISOString().split('T')[0],pair:document.getElementById('pair').value,posisi:document.getElementById('posisi').value,lot:document.getElementById('lot').value,entry:document.getElementById('entry').value,exitPrice:document.getElementById('exitPrice').value,profit:parseFloat(document.getElementById('profit').value||0),strategi:document.getElementById('strategi').value,catatan:document.getElementById('catatan').value};if(!t.profit&&t.profit!==0){alert('Isi profit dulu!');return;}trades.unshift(t);render();document.getElementById('profit').value='';document.getElementById('catatan').value='';alert('Trade disimpan!');}
function hapus(i){if(confirm('Hapus trade ini?')){trades.splice(i,1);render();}}
function hapusSemua(){if(confirm('Hapus SEMUA data?')){trades=[];render();}}
document.getElementById('tanggal').valueAsDate=new Date();render();
</script>
</body>
</html>
