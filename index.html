<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SENGKU PRO V4.2</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet"><style>:root{--y:#facc15;--b:#0a0a0f;--c:#15151f;--l:#1f1f2b;--t:#fff;--s:#6a6a72;--g:#facc15}*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif}body{background:var(--b);color:var(--t);min-height:100vh}.n{position:sticky;top:0;z-index:100;background:rgba(10,10,15,.9);backdrop-filter:blur(20px);border-bottom:1px solid var(--l);padding:12px 16px;display:flex;justify-content:space-between;align-items:center}.n b{font-weight:900;letter-spacing:-1px}.n b span{color:var(--y)}.av{width:32px;height:32px;background:var(--y);color:#000;display:flex;align-items:center;justify-content:center;border-radius:50%;font-weight:900}.cd{background:var(--c);border:1px solid var(--l);border-radius:16px;padding:14px}.bt{background:var(--l);color:var(--s);border:none;padding:8px 14px;border-radius:100px;font-size:11px;font-weight:800;cursor:pointer}.bt.a{background:var(--y);color:#000}.sm{font-size:11px;color:var(--s);font-weight:600}.inp{width:100%;background:var(--l);border:1px solid #2a2a35;color:#fff;padding:10px 12px;border-radius:10px;font-size:13px;outline:none}.inp:focus{border-color:var(--y)}#L{position:fixed;inset:0;z-index:999;background:var(--b);display:flex;align-items:center;justify-content:center;padding:20px}#app{display:none;padding:12px;max-width:600px;margin:auto}.dy{background:var(--c);border:1px solid var(--l);border-radius:12px;padding:8px;min-height:58px}.dy.p{border-color:var(--y)}.tc{display:flex;justify-content:space-between;align-items:center;background:var(--c);border:1px solid var(--l);border-radius:12px;padding:12px;margin-bottom:8px}.pt{font-weight:800;background:var(--y);color:#000;padding:2px 8px;border-radius:6px;font-size:11px}</style></head><body><div id="L"><div class="cd" style="width:100%;max-width:340px"><h2 style="font-weight:900;margin-bottom:4px">SENGKU <span style="color:var(--y)">PRO</span> V4.2</h2><p class="sm" style="margin-bottom:16px">Trading Journal - 6 Part Aman HP</p><input id="e" class="inp" placeholder="Email" style="margin-bottom:8px"><input id="p" type="password" class="inp" placeholder="Password" style="margin-bottom:12px"><button id="lb" class="bt a" style="width:100%;padding:12px" onclick="A()">MASUK / DAFTAR</button><p id="m" class="sm" style="margin-top:10px;text-align:center"></p></div></div><div id="app"><div class="n"><b>SENGKU <span>PRO</span> V4.2</b><div style="display:flex;gap:8px;align-items:center"><span id="hn" class="sm"></span><div id="av" class="av">S</div></div></div><div style="margin-top:12px;display:grid;grid-template-columns:1fr 1fr;gap:8px"><div class="cd"><div class="sm">TOTAL PnL</div><b id="tP" style="font-size:20px">$0.00</b><div id="tC" class="sm"></div></div><div class="cd"><div class="sm">TOTAL TRADE</div><b id="tT" style="font-size:20px">0</b><div class="sm"><span id="wR">0%</span> Winrate</div></div></div><div style="margin-top:12px;display:flex;gap:6px"><button id="cU" class="bt a" onclick="SC('USD')">USD</button><button id="cI" class="bt" onclick="SC('IDR')">IDR</button><button id="cE" class="bt" onclick="SC('EUR')">EUR</button><div style="flex:1"></div><button id="bT" class="bt a" onclick="T('t')">TRADE</button><button id="bC" class="bt" onclick="T('c')">CALENDAR</button><button id="bP" class="bt" onclick="T('p')">CHART</button></div><div id="sT" style="margin-top:12px"><div class="cd"><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><select id="pa" class="inp"><option value="XAUUSD">XAUUSD</option><option value="EURUSD">EURUSD</option><option value="GBPUSD">GBPUSD</option><option value="USDJPY">USDJPY</option><option value="BTCUSD">BTCUSD</option><option value="OTHER">OTHER</option></select><select id="ty" class="inp"><option value="BUY">BUY</option><option value="SELL">SELL</option></select></div><input id="pc" class="inp" placeholder="Pair Custom (ex: DOGEUSD)" style="margin-top:8px;display:none"><div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:8px"><input id="en" class="inp" placeholder="Entry"><input id="sl" class="inp" placeholder="SL"><input id="tp" class="inp" placeholder="TP"></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px"><input id="lo" class="inp" placeholder="Lot"><input id="pn" class="inp" placeholder="PnL $ (wajib)"></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px"><input id="da" type="date" class="inp"><select id="em" class="inp"><option value="">Emosi</option><option value="FOMO">FOMO</option><option value="DISIPLIN">DISIPLIN</option><option value="REVENGE">REVENGE</option><option value="TAKUT">TAKUT</option><option value="SERAKAH">SERAKAH</option></select></div><textarea id="no" class="inp" placeholder="Catatan..." style="margin-top:8px;min-height:60px"></textarea><button class="bt a" style="width:100%;margin-top:10px;padding:12px" onclick="AT()">SIMPAN TRADE</button></div><div style="margin:16px 4px 8px"><b class="sm">RIWAYAT PAIR</b></div><div id="lT"></div></div><div id="sC" style="display:none;margin-top:12px"><div class="cd"><div style="display:flex;justify-content:space-between;align-items:center"><button class="bt" onclick="M(-1)">‹</button><b id="mL"></b><button class="bt" onclick="M(1)">›</button></div><div id="cG" style="display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:12px"></div></div><div class="cd" style="margin-top:8px" id="cD"><p class="sm">Klik tanggal untuk lihat detail</p></div></div><div id="sP" style="display:none;margin-top:12px"><div class="cd"><div style="display:flex;gap:6px;margin-bottom:12px"><button id="wW" class="bt a" onclick="GC('week')">Week</button><button id="wM" class="bt" onclick="GC('month')">Month</button><button id="wY" class="bt" onclick="GC('year')">Year</button></div><div id="cA" style="height:160px;display:flex;align-items:end;gap:6px"></div><div id="cS" class="sm" style="margin-top:8px;text-align:center"></div></div><div class="cd" style="margin-top:8px"><b class="sm">PROFILE</b><div style="display:flex;gap:8px;margin-top:8px"><input id="nI" class="inp" placeholder="Nickname"><button class="bt a" onclick="SN()">SIMPAN</button></div><div style="margin-top:12px"><div class="sm">Login sebagai</div><b id="uE"></b><div class="sm" id="pN"></div><button class="bt" style="margin-top:8px" onclick="LO()">LOGOUT</button></div></div></div></div><script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";import{getAuth,createUserWithEmailAndPassword,signInWithEmailAndPassword,onAuthStateChanged,signOut}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";import{getFirestore,collection,addDoc,onSnapshot,deleteDoc,doc,serverTimestamp,query,orderBy,getDoc,setDoc}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const cfg={apiKey:"AIzaSyDXuveftNQPLHw_2CQ4gLiB1MqGx8u8Fjg",authDomain:"catatan-trading-forex.firebaseapp.com",projectId:"catatan-trading-forex",storageBucket:"catatan-trading-forex.firebasestorage.app",messagingSenderId:"615987792529",appId:"1:615987792529:web:228d5253a125b43d324d30"};const app=initializeApp(cfg);const auth=getAuth(app);const db=getFirestore(app);let TR=[];let cur=new Date();let curC=localStorage.getItem('sengku_curr')||'USD';let curG=localStorage.getItem('sengku_chart')||'week';let prof={nick:''};const R={USD:1,IDR:16500,EUR:0.92};function F(v){let x=v*R[curC];if(curC==='IDR')return 'Rp'+Math.round(x).toLocaleString('id-ID');if(curC==='EUR')return '€'+x.toFixed(2);return '$'+v.toFixed(2);}function I(d){if(!d)return "-";try{return new Date(d).toLocaleDateString('id-ID',{day:'2-digit',month:'short',year:'numeric'});}catch{return d}}document.getElementById('da').value=new Date().toISOString().split('T')[0];document.getElementById('pa').addEventListener('change',e=>{document.getElementById('pc').style.display=e.target.value==='OTHER'?'block':'none';});window.T=(t)=>{document.getElementById('sT').style.display=t==='t'?'block':'none';document.getElementById('sC').style.display=t==='c'?'block':'none';document.getElementById('sP').style.display=t==='p'?'block':'none';document.getElementById('bT').className=t==='t'?'a':'';document.getElementById('bC').className=t==='c'?'a':'';document.getElementById('bP').className=t==='p'?'a':'';if(t==='c')RC();if(t==='p')RG();};window.M=(d)=>{cur.setMonth(cur.getMonth()+d);RC();};window.SC=(c)=>{curC=c;localStorage.setItem('sengku_curr',c);document.getElementById('cU').className=c==='USD'?'a':'';document.getElementById('cI').className=c==='IDR'?'a':'';document.getElementById('cE').className=c==='EUR'?'a':'';RS();RG();LV();};window.GC=(c)=>{curG=c;localStorage.setItem('sengku_chart',c);document.getElementById('wW').className=c==='week'?'a':'';document.getElementById('wM').className=c==='month'?'a':'';document.getElementById('wY').className=c==='year'?'a':'';RG();};window.AT=async()=>{const pa=document.getElementById('pa').value;const pc=document.getElementById('pc').value;const fp=pa==='OTHER'?pc:pa;if(!fp)return alert('Pair wajib!');const ty=document.getElementById('ty').value;const en=document.getElementById('en').value;const sl=document.getElementById('sl').value;const tp=document.getElementById('tp').value;const lo=document.getElementById('lo').value;const pn=parseFloat(document.getElementById('pn').value);if(isNaN(pn))return alert('PnL wajib angka!');const da=document.getElementById('da').value;const em=document.getElementById('em').value;const no=document.getElementById('no').value;try{await addDoc(collection(db,'users',auth.currentUser.uid,'trades'),{pair:fp,type:ty,entry:en,sl:sl,tp:tp,lot:lo,pnl:pn,date:da,emotion:em,note:no,created:serverTimestamp()});document.getElementById('en').value='';document.getElementById('sl').value='';document.getElementById('tp').value='';document.getElementById('lo').value='';document.getElementById('pn').value='';document.getElementById('no').value='';alert('Tersimpan!');}catch(e){alert('Error:'+e.message);}};function RS(){let t=0;TR.forEach(x=>t+=x.pnl);document.getElementById('tP').textContent=F(t);document.getElementById('tP').style.color=t>=0?'var(--y)':'#ef4444';document.getElementById('tT').textContent=TR.length;let w=TR.filter(x=>x.pnl>0).length;document.getElementById('wR').textContent=TR.length?Math.round(w/TR.length*100)+'%':'0%';document.getElementById('tC').textContent=(t>=0?'+':'')+F(t);}function LV(){const el=document.getElementById('lT');el.innerHTML='';[...TR].reverse().forEach(x=>{const d=document.createElement('div');d.className='tc';d.innerHTML=`<div><b>${x.pair}</b> <span class="pt">${x.type}</span><div class="sm">${I(x.date)} • ${x.emotion||'-'}</div></div><div style="text-align:right"><b style="color:${x.pnl>=0?'var(--y)':'#ef4444'}">${F(x.pnl)}</b><div><button class="bt" style="font-size:10px;padding:4px 8px;margin-top:4px" onclick="DT('${x.id}')">Hapus</button></div></div>`;el.appendChild(d);});}window.DT=async(id)=>{if(!confirm('Hapus trade ini?'))return;try{await deleteDoc(doc(db,'users',auth.currentUser.uid,'trades',id));}catch(e){alert(e.message);}};function RC(){const y=cur.getFullYear();const m=cur.getMonth();document.getElementById('mL').textContent=cur.toLocaleDateString('id-ID',{month:'long',year:'numeric'});const g=document.getElementById('cG');g.innerHTML='';['Mg','Sn','Sl','Rb','Km','Jm','Sb'].forEach(d=>{const e=document.createElement('div');e.className='sm';e.style.textAlign='center';e.textContent=d;g.appendChild(e);});const fd=new Date(y,m,1).getDay();const dm=new Date(y,m+1,0).getDate();for(let i=0;i<fd;i++){g.appendChild(document.createElement('div'));}for(let d=1;d<=dm;d++){const dt=new Date(y,m,d);const ds=dt.toISOString().split('T')[0];const dayTr=TR.filter(x=>x.date===ds);let s=dayTr.reduce((a,b)=>a+b.pnl,0);const el=document.createElement('div');el.className='dy'+(s!==0?' p':'');el.innerHTML=`<div style="font-weight:800;font-size:12px">${d}</div>${s!==0?`<div style="font-size:10px;color:${s>0?'var(--y)':'#ef4444'}">${F(s)}</div>`:''}`;el.onclick=()=>{const de=document.getElementById('cD');if(!dayTr.length){de.innerHTML=`<p class="sm">${I(ds)} - Tidak ada trade</p>`;return;}de.innerHTML=`<b class="sm">${I(ds)} - ${dayTr.length} trade - ${F(s)}</b>`+dayTr.map(x=>`<div class="tc" style="margin-top:8px"><div><b>${x.pair}</b> ${x.type}<div class="sm">${x.note||''}</div></div><b style="color:${x.pnl>=0?'var(--y)':'#ef4444'}">${F(x.pnl)}</b></div>`).join('');};g.appendChild(el);}}function RG(){let data=[];let label=[];if(curG==='week'){for(let i=6;i>=0;i--){let d=new Date();d.setDate(d.getDate()-i);let ds=d.toISOString().split('T')[0];let s=TR.filter(x=>x.date===ds).reduce((a,b)=>a+b.pnl,0);data.push(s);label.push(d.toLocaleDateString('id-ID',{weekday:'short'}));}}else if(curG==='month'){for(let i=29;i>=0;i--){let d=new Date();d.setDate(d.getDate()-i);let ds=d.toISOString().split('T')[0];let s=TR.filter(x=>x.date===ds).reduce((a,b)=>a+b.pnl,0);data.push(s);label.push(d.getDate());}}else{for(let i=11;i>=0;i--){let d=new Date();d.setMonth(d.getMonth()-i);let ym=d.toISOString().slice(0,7);let s=TR.filter(x=>x.date&&x.date.startsWith(ym)).reduce((a,b)=>a+b.pnl,0);data.push(s);label.push(d.toLocaleDateString('id-ID',{month:'short'}));}}const cA=document.getElementById('cA');cA.innerHTML='';let mx=Math.max(...data.map(x=>Math.abs(x)),1);data.forEach((v,i)=>{const b=document.createElement('div');b.style.flex='1';b.style.background=v>=0?'var(--y)':'#ef4444';b.style.height=Math.max(8,Math.abs(v)/mx*120)+'px';b.style.borderRadius='6px';b.style.minWidth='8px';b.title=label[i]+': '+F(v);cA.appendChild(b);});let tot=data.reduce((a,b)=>a+b,0);document.getElementById('cS').textContent=label.join(' | ')+' || Total: '+F(tot);}window.SN=async()=>{const n=document.getElementById('nI').value;if(!n)return;try{await setDoc(doc(db,'users',auth.currentUser.uid),{nick:n},{merge:true});prof.nick=n;UP();alert('Nickname disimpan!');}catch(e){alert(e.message);}};function UP(){document.getElementById('hn').textContent=prof.nick||'';document.getElementById('av').textContent=(prof.nick||'S')[0].toUpperCase();document.getElementById('uE').textContent=auth.currentUser?.email||'';document.getElementById('pN').textContent=prof.nick?`Nickname: ${prof.nick}`:'';document.getElementById('nI').value=prof.nick||'';}window.LO=async()=>{await signOut(auth);location.reload();};window.A=async()=>{const e=document.getElementById('e').value.trim();const p=document.getElementById('p').value;const m=document.getElementById('m');if(!e||!p){m.textContent='Email & password wajib!';return;}m.textContent='Loading...';try{await signInWithEmailAndPassword(auth,e,p);}catch{try{await createUserWithEmailAndPassword(auth,e,p);}catch(er){m.textContent=er.message;return;}}};onAuthStateChanged(auth,async(u)=>{if(!u){document.getElementById('L').style.display='flex';document.getElementById('app').style.display='none';return;}document.getElementById('L').style.display='none';document.getElementById('app').style.display='block';try{const s=await getDoc(doc(db,'users',u.uid));if(s.exists()){prof=s.data();}}catch{}UP();SC(curC);GC(curG);T('t');const q=query(collection(db,'users',u.uid,'trades'),orderBy('created','desc'));onSnapshot(q,(snap)=>{TR=[];snap.forEach(d=>{TR.push({id:d.id,...d.data()});});RS();LV();if(document.getElementById('sC').style.display!=='none')RC();if(document.getElementById('sP').style.display!=='none')RG();});});</script></body></html>
