<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SENGKU PRO V4.1 - FINAL ORIGINAL</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;800&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--gold:#facc15;--bg:#09090a;--card:#141416;--border:#232326;--muted:#6a6a72}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:#fff;font-family:'Inter',sans-serif}
h1,b{font-family:'Syne',sans-serif}
#loginPage{max-width:440px;margin:0 auto;min-height:100vh;display:flex;align-items:center;padding:20px}
.login-card{background:radial-gradient(120% 120% at 0% 0%,#1e1e10 0%,var(--card) 40%,#0f0f10 100%);border:1px solid var(--border);border-radius:32px;padding:28px}
input,select{width:100%;background:#0e0e10;border:1px solid var(--border);border-radius:14px;padding:14px 16px;color:#fff;font-size:13px;margin-bottom:10px;outline:none}
input:focus,select:focus{border-color:var(--gold)}
.btn-gold{width:100%;background:var(--gold);color:#000;font-weight:800;padding:16px;border-radius:14px;border:none;cursor:pointer;font-family:'Syne'}
.stat{background:var(--card);border:1px solid var(--border);border-radius:22px;padding:16px;text-align:center}
.small{font-size:11px;color:var(--muted)}
.badge{padding:5px 12px;border-radius:100px;font-size:11px;font-weight:800}
.badge-buy{background:rgba(250,204,21,.15);color:var(--gold);border:1px solid rgba(250,204,21,.3)}
.badge-sell{background:rgba(255,255,255,.08);color:#fff;border:1px solid var(--border)}
.header{position:sticky;top:0;z-index:10;background:rgba(9,9,10,.9);backdrop-filter:blur(14px);border-bottom:1px solid var(--border);padding:16px 20px;display:flex;justify-content:space-between;align-items:center}
.tab{display:flex;gap:8px;margin:18px 0;background:var(--card);padding:6px;border-radius:16px;border:1px solid var(--border)}
.tab button{flex:1;padding:11px;border-radius:12px;border:none;background:transparent;color:var(--muted);font-size:12px;font-weight:700}
.tab button.active{background:var(--gold);color:#000}
.card{background:var(--card);border:1px solid var(--border);border-radius:24px;padding:20px}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
.cal-day{background:#0f0f11;border:1px solid var(--border);border-radius:14px;padding:8px;min-height:68px;text-align:center}
.cal-day.has-profit{background:linear-gradient(180deg,rgba(250,204,21,.12),rgba(250,204,21,.03));border-color:rgba(250,204,21,.35)}
.cal-day.has-loss{background:rgba(239,68,68,.06);border-color:rgba(239,68,68,.2)}
.cal-day.today{border-color:var(--gold)}
.trade-card{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:16px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;position:relative}
.trade-card::before{content:"";position:absolute;left:0;top:16px;bottom:16px;width:3px;background:var(--gold);border-radius:0 3px 3px 0}
.pair-tag{background:#1d1d1f;border:1px solid var(--border);color:var(--gold);padding:3px 8px;border-radius:8px;font-size:11px;font-weight:700}
</style>
</head>
<body>
<div id="loginPage"><div class="login-card" style="width:100%"><div style="display:flex;gap:12px"><div style="width:42px;height:42px;background:var(--gold);border-radius:14px;display:grid;place-items:center;color:#000;font-weight:900;font-size:20px">S</div><div><h1 style="font-size:24px;font-weight:800">SENGKU PRO</h1><p style="font-size:11px;color:var(--gold);letter-spacing:2px;font-weight:700">V4.1 FINAL</p></div></div><p class="small" style="margin:12px 0 20px">Design ORIGINAL Gold Black • 32 Pair Lengkap • SL TP • Kalender • Emosi</p><input id="emailInput" type="email" value="realme508734@gmail.com"><input id="passInput" type="password" placeholder="Password min 6"><button id="loginBtn" class="btn-gold" onclick="handleAuth()">MASUK / DAFTAR 🔥</button><p id="authMsg" class="small" style="text-align:center;margin-top:14px;color:#ef4444"></p></div></div>
<div id="appPage" style="display:none"><div class="header"><div style="display:flex;gap:10px;align-items:center"><div style="width:32px;height:32px;background:var(--gold);border-radius:10px;display:grid;place-items:center;color:#000;font-weight:900">S</div><b>SENGKU PRO <span style="color:var(--gold)">V4.1</span></b></div><div style="display:flex;gap:8px;align-items:center"><span id="userEmail" class="small"></span><button onclick="handleLogout()" style="background:var(--card);color:#fff;border:1px solid var(--border);padding:7px 14px;border-radius:12px;font-size:12px">Logout</button></div></div><div style="max-width:580px;margin:0 auto;padding:16px"><div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin:16px 0"><div class="stat" style="background:linear-gradient(180deg,#1d1c0f,#141416)"><p class="small">TOTAL PNL</p><p id="totalPnl" style="font-size:20px;font-weight:800;margin-top:6px">$0.00</p></div><div class="stat"><p class="small">WIN RATE</p><p id="winRate" style="font-size:20px;font-weight:800;margin-top:6px">0%</p></div><div class="stat"><p class="small">TOTAL PAIR</p><p id="totalTrade" style="font-size:20px;font-weight:800;margin-top:6px">0</p></div></div><div class="tab"><button id="tabTrade" class="active" onclick="switchTab('trade')">+ Pair Baru</button><button id="tabCal" onclick="switchTab('cal')">📅 Kalender PnL</button></div><div id="tradeSection" class="card"><div style="display:flex;justify-content:space-between;margin-bottom:14px"><b>+ Trade Pair Baru</b><span class="pair-tag">32 PAIR</span></div><div style="display:grid;grid-template-columns:1.3fr .7fr;gap:8px"><select id="pairInput"><option value="XAUUSD">XAUUSD • Gold - Emas</option><option value="XAGUSD">XAGUSD • Silver - Perak</option><option value="XPTUSD">XPTUSD • Platinum</option><option value="EURUSD">EURUSD • Euro / USD</option><option value="GBPUSD">GBPUSD • Pound / USD</option><option value="USDJPY">USDJPY • Dollar / Yen</option><option value="USDCHF">USDCHF • Dollar / Franc</option><option value="AUDUSD">AUDUSD • Aussie / USD</option><option value="NZDUSD">NZDUSD • Kiwi / USD</option><option value="USDCAD">USDCAD • Dollar / CAD</option><option value="EURGBP">EURGBP • Euro / Pound</option><option value="EURJPY">EURJPY • Euro / Yen</option><option value="GBPJPY">GBPJPY • Pound / Yen - Volatile</option><option value="AUDJPY">AUDJPY • Aussie / Yen</option><option value="EURAUD">EURAUD • Euro / Aussie</option><option value="GBPAUD">GBPAUD • Pound / Aussie</option><option value="GBPCAD">GBPCAD • Pound / CAD</option><option value="AUDCAD">AUDCAD • Aussie / CAD</option><option value="CADJPY">CADJPY • CAD / Yen</option><option value="CHFJPY">CHFJPY • Franc / Yen</option><option value="USDTRY">USDTRY • Dollar / Lira - Exotic</option><option value="USDZAR">USDZAR • Dollar / Rand - Exotic</option><option value="BTCUSD">BTCUSD • Bitcoin</option><option value="ETHUSD">ETHUSD • Ethereum</option><option value="SOLUSD">SOLUSD • Solana</option><option value="NAS100">NAS100 • Nasdaq 100</option><option value="US30">US30 • Dow Jones</option><option value="SPX500">SPX500 • S&P 500</option><option value="GER40">GER40 • DAX Jerman</option><option value="UK100">UK100 • FTSE UK</option><option value="JP225">JP225 • Nikkei Jepang</option><option value="USOIL">USOIL • Crude Oil WTI</option><option value="UKOIL">UKOIL • Brent Oil</option><option value="OTHER">✏️ Custom Pair... Tulis Manual</option></select><select id="typeInput"><option value="BUY">BUY 🟡</option><option value="SELL">SELL ⚪</option></select></div><input id="pairCustom" type="text" placeholder="Tulis pair custom..." style="display:none"><div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px"><input id="entryInput" type="number" step="0.01" placeholder="Entry"><input id="slInput" type="number" step="0.01" placeholder="SL"><input id="tpInput" type="number" step="0.01" placeholder="TP"></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><input id="lotInput" type="number" step="0.01" placeholder="Lot 0.10"><input id="pnlInput" type="number" step="0.01" placeholder="PnL $"></div><label class="small" style="display:block;margin:4px 0 6px">📅 Tanggal - bebas tanpa batas</label><input id="dateInput" type="date" style="color-scheme:dark"><select id="emotionInput" style="border-style:dashed"><option value="">🧠 Emosi (opsional)</option><option value="Disiplin ✅">Disiplin ✅</option><option value="Tenang 😌">Tenang 😌</option><option value="FOMO 😰">FOMO 😰</option><option value="Serakah 🤑">Serakah 🤑</option><option value="Takut 😨">Takut 😨</option><option value="Balas Dendam 😡">Balas Dendam 😡</option></select><input id="noteInput" type="text" placeholder="📝 Catatan..."><button class="btn-gold" onclick="addTrade()" style="margin-top:6px">SIMPAN KE CLOUD ☁️</button></div><div id="calSection" class="card" style="display:none"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px"><b style="font-size:14px">📅 Kalender Untung Rugi</b><div style="display:flex;gap:6px;align-items:center"><button onclick="changeMonth(-1)" style="background:var(--card);color:#fff;border:1px solid var(--border);padding:7px 12px;border-radius:10px">‹</button><span id="monthLabel" style="font-size:13px;font-weight:800"></span><button onclick="changeMonth(1)" style="background:var(--card);color:#fff;border:1px solid var(--border);padding:7px 12px;border-radius:10px">›</button></div></div><div id="calGrid" class="cal-grid"></div><div id="calDetail" style="margin-top:16px"></div></div><div style="margin:22px 4px 12px"><b style="font-size:12px;color:#9a9a9e;letter-spacing:1px">RIWAYAT PAIR</b></div><div id="listTrade"></div></div></div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, addDoc, onSnapshot, deleteDoc, doc, serverTimestamp, query, orderBy } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const firebaseConfig = {
  apiKey: "AIzaSyDXuveftNQPLHw_2CQ4gLiB1MqGx8u8Fjg",
  authDomain: "catatan-trading-forex.firebaseapp.com",
  projectId: "catatan-trading-forex",
  storageBucket: "catatan-trading-forex.firebasestorage.app",
  messagingSenderId: "615987792529",
  appId: "1:615987792529:web:228d5253a125b43d324d30"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
let allTrades=[];let curMonth=new Date();
const dateInput=document.getElementById('dateInput');dateInput.value=new Date().toISOString().split('T')[0];dateInput.removeAttribute('min');dateInput.removeAttribute('max');
document.getElementById('pairInput').addEventListener('change',(e)=>{document.getElementById('pairCustom').style.display=e.target.value==='OTHER'?'block':'none';});
window.switchTab=(t)=>{document.getElementById('tradeSection').style.display=t==='trade'?'block':'none';document.getElementById('calSection').style.display=t==='cal'?'block':'none';document.getElementById('tabTrade').className=t==='trade'?'active':'';document.getElementById('tabCal').className=t==='cal'?'active':'';if(t==='cal')renderCalendar();};
window.changeMonth=(d)=>{curMonth.setMonth(curMonth.getMonth()+d);renderCalendar();};
window.handleAuth=async()=>{const email=document.getElementById('emailInput').value.trim();const pass=document.getElementById('passInput').value.trim();const msg=document.getElementById('authMsg');const btn=document.getElementById('loginBtn');if(!email||!pass){msg.innerText="Isi email & pass!";return;}btn.innerText="LOADING...";btn.disabled=true;try{await signInWithEmailAndPassword(auth,email,pass);}catch(e){if(e.code.includes("invalid-credential")||e.code.includes("user-not-found")||e.code.includes("invalid-login")){try{await createUserWithEmailAndPassword(auth,email,pass);}catch(err){msg.innerText=err.message;btn.innerText="MASUK / DAFTAR 🔥";btn.disabled=false;return;}}else{msg.innerText=e.message;btn.innerText="MASUK / DAFTAR 🔥";btn.disabled=false;return;}}};
onAuthStateChanged(auth,(user)=>{if(user){document.getElementById('loginPage').style.display="none";document.getElementById('appPage').style.display="block";document.getElementById('userEmail').innerText=user.email;loadTrades(user.uid);}else{document.getElementById('loginPage').style.display="flex";document.getElementById('appPage').style.display="none";document.getElementById('loginBtn').innerText="MASUK / DAFTAR 🔥";document.getElementById('loginBtn').disabled=false;}});
window.handleLogout=async()=>{await signOut(auth);};
function formatIndo(d){if(!d)return "-";try{return new Date(d).toLocaleDateString('id-ID',{day:'2-digit',month:'short',year:'numeric'});}catch{return d}}
function renderCalendar(){const grid=document.getElementById('calGrid');const label=document.getElementById('monthLabel');label.innerText=curMonth.toLocaleDateString('id-ID',{month:'long',year:'numeric'});grid.innerHTML="";const year=curMonth.getFullYear();const month=curMonth.getMonth();const firstDay=new Date(year,month,1).getDay();const daysInMonth=new Date(year,month+1,0).getDate();const map={};allTrades.forEach(t=>{const d=t.tradeDate||t.date;if(!d)return;const dt=new Date(d);if(dt.getMonth()===month&&dt.getFullYear()===year){const key=d;if(!map[key])map[key]={total:0,count:0};map[key].total+=parseFloat(t.pnl||0);map[key].count++;}});for(let i=0;i<firstDay;i++){grid.innerHTML+=`<div class="cal-day" style="opacity:.15"></div>`;}const todayStr=new Date().toISOString().split('T')[0];for(let day=1;day<=daysInMonth;day++){const dateStr=`${year}-${String(month+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;const data=map[dateStr];let cls="cal-day";if(data){cls+=data.total>0?" has-profit":data.total<0?" has-loss":"";}if(dateStr===todayStr)cls+=" today";const pnlTxt=data?(data.total>0?`+$${data.total.toFixed(0)}`:`$${data.total.toFixed(0)}`):"";grid.innerHTML+=`<div class="${cls}" onclick="showDay('${dateStr}')"><div style="font-size:12px;font-weight:800">${day}</div><div style="font-size:11px;margin-top:4px;font-weight:800;color:${data?(data.total>=0?'#facc15':'#ef4444'):'#6a6a72'}">${pnlTxt}</div></div>`;}}
window.showDay=(dateStr)=>{const trades=allTrades.filter(t=>(t.tradeDate||t.date)===dateStr);const detail=document.getElementById('calDetail');if(trades.length===0){detail.innerHTML=`<p class="small">Gak ada trade di ${formatIndo(dateStr)}</p>`;return;}let total=trades.reduce((s,t)=>s+parseFloat(t.pnl||0),0);detail.innerHTML=`<div class="card" style="padding:14px;border-color:var(--gold)"><b style="font-size:13px">${formatIndo(dateStr)} • ${trades.length} pair • Total: <span style="color:${total>=0?'var(--gold)':'#ef4444'}">$${total.toFixed(2)}</span></b></div>`;};
function loadTrades(uid){const q=query(collection(db,"users",uid,"trades"),orderBy("createdAt","desc"));onSnapshot(q,(snap)=>{allTrades=[];let total=0,win=0;snap.forEach(d=>{const data=d.data();allTrades.push({id:d.id,...data});total+=parseFloat(data.pnl||0);if(parseFloat(data.pnl)>0)win++;});document.getElementById('totalPnl').innerText="$"+total.toFixed(2);document.getElementById('totalPnl').style.color=total>=0?"var(--gold)":"#ef4444";document.getElementById('totalTrade').innerText=allTrades.length;document.getElementById('winRate').innerText=allTrades.length?Math.round(win/allTrades.length*100)+"%":"0%";const c=document.getElementById('listTrade');c.innerHTML="";allTrades.forEach(t=>{const badge=t.type==="BUY"?'<span class="badge badge-buy">BUY</span>':'<span class="badge badge-sell">SELL</span>';c.innerHTML+=`<div class="trade-card"><div style="flex:1"><div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap"><span class="pair-tag">${t.pair||'XAUUSD'}</span>${badge}<span class="small">📅 ${formatIndo(t.tradeDate||t.date)}</span></div><div style="font-size:12px;margin-top:6px">Entry ${t.entry||'-'} • SL ${t.sl||'-'} • TP ${t.tp||'-'} • Lot ${t.lot||'-'}</div><div class="small" style="margin-top:4px">${t.emotion?'🧠 '+t.emotion+' • ':''}${t.note||''}</div></div><div style="text-align:right;margin-left:10px"><b style="font-size:15px;color:${parseFloat(t.pnl)>=0?'#facc15':'#ef4444'}">$${t.pnl}</b><br><span class="small" style="cursor:pointer" onclick="delTrade('${t.id}')">hapus</span></div></div>`;});if(document.getElementById('calSection').style.display!=='none')renderCalendar();});}
window.addTrade=async()=>{const u=auth.currentUser;if(!u)return;let pair=document.getElementById('pairInput').value;if(pair==='OTHER'){pair=document.getElementById('pairCustom').value.trim().toUpperCase()||'CUSTOM';}const type=document.getElementById('typeInput').value;const entry=document.getElementById('entryInput').value;const sl=document.getElementById('slInput').value;const tp=document.getElementById('tpInput').value;const lot=document.getElementById('lotInput').value;const pnl=document.getElementById('pnlInput').value;const tradeDate=document.getElementById('dateInput').value||new Date().toISOString().split('T')[0];const emotion=document.getElementById('emotionInput').value;const note=document.getElementById('noteInput').value;if(!pnl){alert("Isi PnL dulu!");return;}await addDoc(collection(db,"users",u.uid,"trades"),{pair,type,entry,sl,tp,lot,pnl:parseFloat(pnl),tradeDate,date:tradeDate,emotion,note,createdAt:serverTimestamp()});document.getElementById('pnlInput').value="";document.getElementById('entryInput').value="";document.getElementById('slInput').value="";document.getElementById('tpInput').value="";document.getElementById('noteInput').value="";};
window.delTrade=async(id)=>{const u=auth.currentUser;if(confirm("Hapus?"))await deleteDoc(doc(db,"users",u.uid,"trades",id));};
</script>
</body>
</html>
